# ┌─ H4UI ──────────────────────────────────────────────
# │ QUÉ ES:        el interruptor que le dice a SDDM (la pantalla de login)
# │                 "usá el tema h4ui-sddm". Sin este archivo, SDDM arranca
# │                 con el tema gris de fábrica aunque el tema H4UI ya esté
# │                 copiado en /usr/share/sddm/themes/.
# │ PODÉS CAMBIAR: nada — es una sola línea con un solo propósito.
# │ NO TOQUES:     "Current=h4ui-sddm" tiene que ser IDÉNTICO al nombre de
# │                 la carpeta del tema (Theme-Id en metadata.desktop).
# │ VA EN:         /etc/sddm.conf.d/10-h4ui-theme.conf
# │ NOTA:          este archivo vive bajo system/ en el repo — un tercer
# │                 árbol espejo (además de home/ y usr/) que mapea a "/",
# │                 para las pocas cosas H4UI-specific que van en /etc.
# │                 install.sh lo copia con sudo, igual que usr/.
# └──────────────────────────────────────────────────────
[Theme]
Current=h4ui-sddm
