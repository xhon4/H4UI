[General]

# --- PATHS ---
# Fondo del login: bloq.png es la imagen Frutiger Aero de la carpeta del
# tema (cielo, agua, burbujas). Si la borrás o dejás esta línea vacía,
# Main.qml cae al degradé cielo->profundo como respaldo.
Background="/usr/share/sddm/themes/h4ui-sddm/bloq.png"
UserIcon="~/.face.icon"

Font="Selawik"
FontSize="12"

# --- COLORS (paleta H4UI / Frutiger Aero, ver theme/colors/palette.toml) ---
MainColor="#0757C8"
PanelColor="#DDFBFF"
AccentColor="#168CFF"
TextColor="#0A2A3F"
InputColor="#EBFDFF"
InputTextColor="#0A2A3F"
DangerColor="#FF5B5B"

InputBorderColor="#FFFFFF"

# --- LOGIN BUTTON ---
ButtonColor="#168CFF"
ButtonTextColor="#0A2A3F"

# Esquinas MUY redondeadas -- lo opuesto del CornerRadius=0 de r4chi.
CornerRadius="22"
RoundCorners="1"
InputCornerRadius="18"
ButtonCornerRadius="16"

BorderWidth="2"
BorderColor="#FFFFFF"

# --- PANEL STYLING ---
PanelOpacity="0.92"
