# ┌─ H4UI ──────────────────────────────────────────────
# │ QUÉ ES:        qué tema/iconos/cursor/fuente usan las apps GTK3
# │                 (Firefox, apps viejas) cuando arrancan.
# │ PODÉS CAMBIAR: gtk-font-name (tamaño de letra) y los booleanos
# │                 (0/1) de gtk-button-images / gtk-menu-images.
# │ NO TOQUES:     gtk-theme-name=H4UI — es el que apunta al tema de
# │                 theme/gtk/H4UI/. Si lo cambiás, perdés el vidrio Aero.
# │ VA EN:         ~/.config/gtk-3.0/settings.ini
# └──────────────────────────────────────────────────────
[Settings]
gtk-theme-name=H4UI
# 👉 Papirus-Dark + Bibata-Modern-Ice: elegidos a propósito para que
# combinen con el vidrio celeste de H4UI. Son los mismos que hyprland.lua
# fuerza por variables de entorno (XCURSOR_THEME/HYPRCURSOR_THEME), así
# que todo el sistema usa el mismo cursor e iconos, no solo GTK3.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-font-name=Selawik 10   # 👉 tipografía y tamaño de letra de las apps GTK3
gtk-application-prefer-dark-theme=1
gtk-button-images=1
gtk-menu-images=1
gtk-decoration-layout=menu:minimize,maximize,close
