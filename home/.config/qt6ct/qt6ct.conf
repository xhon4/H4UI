; ┌─ H4UI ──────────────────────────────────────────────
; │ QUÉ ES:        cómo se ven las apps Qt6 (Kvantum como motor de
; │                 estilo, para que respeten el vidrio Aero).
; │ PODÉS CAMBIAR: los nombres/tamaños dentro de [Fonts].
; │ NO TOQUES:     style=kvantum — sin eso, las apps Qt6 vuelven al
; │                 tema gris de fábrica y rompen la estética.
; │ OJO:           esta app (qt6ct) reescribe este archivo con su propia
; │                 GUI. Si abrís qt6ct y guardás cambios ahí, estos
; │                 comentarios se van a borrar — es una limitación del
; │                 formato INI que usa Qt (QSettings), no un error tuyo.
; │ VA EN:         ~/.config/qt6ct/qt6ct.conf
; └──────────────────────────────────────────────────────
[Appearance]
style=kvantum
icon_theme=Papirus-Dark
custom_palette=false
standard_dialogs=default

[Fonts]
general="Selawik,10,-1,5,50,0,0,0,0,0"                       ; 👉 fuente UI general
fixed="JetBrainsMono Nerd Font,10,-1,5,50,0,0,0,0,0"          ; 👉 fuente monoespaciada

[Interface]
cursor_flash_time=1000
