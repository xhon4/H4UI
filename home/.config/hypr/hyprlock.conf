# ┌─ H4UI ──────────────────────────────────────────────
# │ QUÉ ES:        la pantalla de bloqueo (hyprlock). Se abre con Super+L
# │                o sola cuando hypridle detecta que estuviste inactivo.
# │ PODÉS CAMBIAR: los colores (ver theme/colors/palette.toml), el blur,
# │                el texto de los labels, el reloj.
# │ NO TOQUES:     los nombres de las claves (general, background,
# │                input-field, label) ni "auth" — son sintaxis de hyprlock.
# │ VA EN:         ~/.config/hypr/hyprlock.conf
# └──────────────────────────────────────────────────────

$aqua   = rgba(29ABE2ee)
$sky    = rgba(6FD3FFcc)
$deep   = rgba(0B5FA5ee)
$ink    = rgba(0A2A3Fee)
$danger = rgba(FF5B5Bee)
$glass  = rgba(FFFFFF26)   # 👉 blanco al 15% aprox — el "vidrio" de la caja

general {
    grace = 2                  # 👉 segundos de gracia: movés el mouse y no repide clave
    hide_cursor = false
    no_fade_in = false
    ignore_empty_input = true  # enter con el campo vacío no intenta loguear
}

# ┌─ Fondo: el mismo wallpaper FA, pero con blur fuerte (efecto vidrio) ──
background {
    monitor =
    path = ~/.config/hypr/wallpaper.png   # 👉 cambiá la ruta si usás otro fondo
    blur_size = 7                          # 👉 si lagea en tu Vega, bajá a 3-4
    blur_passes = 3
    vibrancy = 0.35
    color = $ink                           # se ve si el wallpaper no carga
}

# ┌─ Caja de contraseña: vidrio Aero con borde aqua ──────────────────────
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    rounding = 16                          # 👉 esquinas más o menos redondas
    outer_color = $aqua
    inner_color = $glass
    font_color = $ink
    fade_on_empty = false
    placeholder_text = <span foreground="##0A2A3F">Contraseña...</span>
    fail_color = $danger
    fail_text = <span foreground="##FF5B5B">Probá de nuevo 👉</span>
    check_color = $sky                      # color mientras valida
    position = 0, -40
    halign = center
    valign = center
}

# ┌─ Reloj grande, estilo widget Win7 Sidebar ────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(FFFFFFee)
    font_size = 90
    font_family = Selawik   # 👉 si no la tenés instalada, cae a la fuente default
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d de %B')"
    color = rgba(FFFFFFcc)
    font_size = 22
    font_family = Selawik
    position = 0, 90
    halign = center
    valign = center
}

# Saludo con tu usuario — toque personal (cmd[] para que resuelva $USER de verdad)
label {
    monitor =
    text = cmd[update:0] echo "Hola, $USER 👋"
    color = rgba(FFFFFFcc)
    font_size = 16
    font_family = Selawik
    position = 0, -110
    halign = center
    valign = center
}
