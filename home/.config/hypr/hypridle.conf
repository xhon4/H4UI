# ┌─ H4UI ──────────────────────────────────────────────
# │ QUÉ ES:        vigila si estuviste inactivo y decide qué hacer
# │                (bloquear, apagar pantalla). Arranca solo con Hyprland.
# │ PODÉS CAMBIAR: los "timeout" (en segundos) de cada listener.
# │ NO TOQUES:     lock_cmd tal como está — el "pidof hyprlock ||" evita que
# │                se abran dos pantallas de bloqueo encimadas.
# │ VA EN:         ~/.config/hypr/hypridle.conf
# └──────────────────────────────────────────────────────
# 👉 El suspend automático viene DESACTIVADO a propósito (ver abajo del
#    todo): un novato no tiene por qué encontrarse la PC apagada sola.
#    Si lo querés, descomentá ese listener.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session   # si el sistema suspende (por batería, tapa, etc.), bloqueá antes
    after_sleep_cmd = hyprctl dispatch dpms on  # al volver, que la pantalla no quede negra
    ignore_dbus_inhibit = false                 # respeta cuando una app pide "no bloquees" (ej. viendo un video)
}

# 5 minutos sin tocar nada -> bloquea
listener {
    timeout = 300               # 👉 subilo/bajalo a gusto (en segundos)
    on-timeout = loginctl lock-session
}

# 30 segundos después de bloquear -> apaga la pantalla (ahorra energía)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 👉 Opcional: suspender la PC tras media hora de inactividad total.
# Descomentá las 3 líneas si lo querés (queda comentado por defecto).
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
