# ┌─ H4UI ──────────────────────────────────────────────
# │ QUÉ ES:        qué tema/iconos/cursor/fuente usan las apps GTK4
# │                 "clásicas" (las libadwaita en realidad leen sus
# │                 propios named colors, pero igual respetan cursor/icon
# │                 theme de acá).
# │ PODÉS CAMBIAR: gtk-font-name (tamaño de letra).
# │ NO TOQUES:     gtk-theme-name=H4UI — apunta al tema de theme/gtk/H4UI/.
# │ VA EN:         ~/.config/gtk-4.0/settings.ini
# └──────────────────────────────────────────────────────
[Settings]
gtk-theme-name=H4UI
# 👉 Papirus-Dark + Bibata-Modern-Ice: a propósito, combinan con el vidrio
# celeste de H4UI. Son los mismos que hyprland.lua fuerza por variables de
# entorno (XCURSOR_THEME/HYPRCURSOR_THEME) para todo el sistema.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-font-name=Selawik 10   # 👉 tipografía y tamaño de letra de las apps GTK4
gtk-application-prefer-dark-theme=1
